[package]
name = "rieul-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[features]
default = []
native = ["dep:gpui", "dep:gpui_macos", "dep:image", "dep:qrcode"]

[[bin]]
name = "rieul-gpui"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow = "1"
libc = "0.2"
serde_yaml = "0.9"
rieul-daemon-core = { path = "../core" }
rand = "0.9"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "a4b39c38e0056a5631a6f49f7fb13d4d1c4b6a9c", default-features = false, optional = true }

image = { version = "0.25", default-features = false, features = ["png"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[workspace]

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "a4b39c38e0056a5631a6f49f7fb13d4d1c4b6a9c", default-features = false, features = ["font-kit", "runtime_shaders"], optional = true }
