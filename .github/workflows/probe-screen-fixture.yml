name: Screen capture capability probe
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Isolated capability gate or live synthetic scroll observation
        type: choice
        options: [capability, scroll, replay_control]
        default: capability
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'disjukr/rieul.app' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.scenario == 'capability'
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile isolated capability probe
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$(id -un)" = runner
          clang -arch arm64 -fobjc-arc -mmacosx-version-min=13.0 \
            scripts/testing/macos-screen-capability.m daemon/macos/native/desktop.m \
            -framework Foundation -framework Security -framework AppKit \
            -framework CoreGraphics -framework CoreMedia -framework CoreVideo \
            -framework ScreenCaptureKit -framework VideoToolbox -framework ApplicationServices \
            -o "$RUNNER_TEMP/rieul-screen-capability"
      - name: Probe existing permission and hardware only
        shell: bash
        run: '"$RUNNER_TEMP/rieul-screen-capability"'
  scroll:
    if: github.repository == 'disjukr/rieul.app' && github.ref == 'refs/heads/screen-hosted-live-scroll-test' && github.event_name == 'workflow_dispatch' && (inputs.scenario == 'scroll' || inputs.scenario == 'replay_control')
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RIEUL_HOSTED_SCREEN_SCROLL: ${{ inputs.scenario == 'scroll' && '1' || '0' }}
      RIEUL_WT_DIAGNOSTIC: "1"
      RIEUL_FIXTURE_TEST: ${{ inputs.scenario == 'replay_control' && 'browser_hardware_ipc_two_displays_and_disconnect_release' || 'browser_live_hosted_scroll' }}
      RIEUL_TEST_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - name: Restore existing locked project dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile hosted-only synthetic producer
        if: inputs.scenario == 'scroll'
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$(id -un)" = runner
          test -x "$RIEUL_TEST_CHROME"
          clang -arch arm64 -fobjc-arc -mmacosx-version-min=13.0 \
            scripts/testing/macos-screen-live.m daemon/macos/native/desktop.m \
            -framework Foundation -framework Security -framework AppKit \
            -framework CoreGraphics -framework CoreMedia -framework CoreVideo \
            -framework ScreenCaptureKit -framework VideoToolbox -framework ApplicationServices \
            -o "$RUNNER_TEMP/rieul-screen-live"
      - name: Build release test fixture without running capture
        run: cargo test --release --locked -p rieul-daemon-host "$RIEUL_FIXTURE_TEST" --no-run
      - name: Observe one bounded synthetic scroll functional run
        if: inputs.scenario == 'scroll'
        shell: bash
        run: |
          uptime
          sysctl -n hw.logicalcpu
          sw_vers
          node --version
          cargo --version
          "$RIEUL_TEST_CHROME" --version
          printf '{"repetition":1,"scope":"temporary-branch functional prerequisite only; damage/paintover unmeasured"}\n'
          cargo test --release --locked -p rieul-daemon-host browser_live_hosted_scroll -- --ignored --nocapture
      - name: Run one recorded replay WebTransport control without capture
        if: inputs.scenario == 'replay_control'
        shell: bash
        run: |
          test "$RIEUL_HOSTED_SCREEN_SCROLL" = 0
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = ARM64
          sw_vers
          "$RIEUL_TEST_CHROME" --version
          cargo test --release --locked -p rieul-daemon-host "$RIEUL_FIXTURE_TEST" -- --ignored --nocapture
