name: Probe isolated native updater runner
on:
  push:
    branches: ['test/updater-device-repair-native']
permissions: {}
jobs:
  read-only-capabilities:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Report capability booleans only
        shell: bash
        run: |
          flag() { local key="$1"; shift; if "$@"; then echo "$key=true"; else echo "$key=false"; fi; }
          arm64() { [[ "$(uname -m)" == arm64 ]]; }
          virtual_mac() { [[ "$(/usr/sbin/sysctl -n hw.model)" == VirtualMac* ]]; }
          console_is_runner() { [[ "$(/usr/bin/stat -f %u /dev/console)" == "$(/usr/bin/id -u)" ]]; }
          root_probe() { [[ "$(sudo -n /usr/bin/id -u 2>/dev/null)" == 0 ]]; }
          console_gui() { /bin/launchctl print "gui/$(/usr/bin/stat -f %u /dev/console)" >/dev/null 2>&1; }
          no_rieul_system_job() { ! /bin/launchctl print system/app.rieul.daemon >/dev/null 2>&1; }
          no_existing_rieul_paths() {
            local path
            for path in '/Applications/Rieul.app' '/Library/Application Support/rieul' '/Library/LaunchDaemons/app.rieul.daemon.plist'; do
              if [[ -e "$path" || -L "$path" ]]; then return 1; fi
            done
          }
          flag arm64 arm64
          flag virtual_mac virtual_mac
          flag noninteractive_root root_probe
          flag console_is_runner console_is_runner
          flag console_launchd_domain console_gui
          flag no_rieul_system_job no_rieul_system_job
          flag no_existing_rieul_paths no_existing_rieul_paths
