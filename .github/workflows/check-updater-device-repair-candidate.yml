name: Check isolated signed-fixture source without credentials
on:
  push:
    branches: ['test/updater-device-repair-native']
permissions:
  contents: read
jobs:
  native-fixture-compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - name: Compile native fixture and run only nonprivileged tests
        run: |
          cargo test --locked -p rieul-macos-daemon --features updater-device-repair --lib root_update::device_repair
          /bin/bash -n scripts/macos/test-signed-device-repair-fixture.sh
      - name: Prove the privileged fixture rejects a branch push
        run: |
          if output="$(/bin/bash scripts/macos/test-signed-device-repair-fixture.sh no-pkg no-bin 2>&1)"; then
            echo 'Fixture unexpectedly accepted an unauthorized workflow context.' >&2
            exit 1
          fi
          [[ "$output" == 'Refusing test outside guarded disposable hosted ARM64 VM.' ]]
