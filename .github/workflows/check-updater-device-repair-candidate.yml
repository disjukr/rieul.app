name: Check updater device repair candidate
on:
  push:
    branches: ['test/updater-device-repair-native']
permissions:
  contents: read
jobs:
  native-check:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked -p rieul-macos-daemon --features updater-device-repair --bin rieul-macos-system
      - run: cargo test --locked -p rieul-macos-daemon --features updater-device-repair --lib root_update::device_repair
      - run: |
          /bin/bash -n scripts/macos/package-updater-device-repair.sh
          /bin/bash -n scripts/macos/pkg-scripts-device-repair/postinstall
