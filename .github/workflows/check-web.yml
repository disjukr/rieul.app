name: Check web and code generation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    # Playwright 1.56.1 supports Ubuntu 24.04, not the moving latest image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
