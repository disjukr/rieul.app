name: Check native pairing bundle
on:
  push:
    branches: [main, codex/runtime-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-pairing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact desktop dependencies
        working-directory: pairing
        run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: intel-native
        if: matrix.os == 'macos-15-intel'
        with:
          path: target/native/gpuix-0.11.0
          key: gpuix-2e31b47-darwin-x64-rust1.97.1-test-support-macos13-v1
      - name: Build unchanged upstream Intel native addon
        if: matrix.os == 'macos-15-intel' && steps.intel-native.outputs.cache-hit != 'true'
        run: |
          sh pairing/scripts/build-native-macos-intel.sh
      - uses: actions/cache/save@v4
        if: matrix.os == 'macos-15-intel' && steps.intel-native.outputs.cache-hit != 'true'
        with:
          path: target/native/gpuix-0.11.0
          key: gpuix-2e31b47-darwin-x64-rust1.97.1-test-support-macos13-v1
      - name: Check Intel addon cache provenance and integrity
        if: matrix.os == 'macos-15-intel'
        run: |
          test "$(cat target/native/gpuix-0.11.0/source-commit.txt)" = 2e31b47ff6432ceebe70e7fc7b0f51a76d7d30cf
          (cd target/native/gpuix-0.11.0 && shasum -a 256 -c addon.sha256)
          echo "RIEUL_NATIVE_ADDON=$PWD/target/native/gpuix-0.11.0/gpuix-native.darwin-x64.node" >> "$GITHUB_ENV"
      - name: Types and request/IPC regressions
        working-directory: pairing
        run: |
          bun run check
          bun run test
      - name: Verify development process ownership without starting services
        run: bash scripts/macos/test-dev-process-scope.sh
      - name: Compile and exercise AppKit bridge
        run: |
          sh pairing/scripts/build-bridge-macos.sh
          clang -mmacosx-version-min=13.0 -g -fobjc-arc -std=c11 -framework Cocoa -framework UserNotifications pairing/tests/macos-bridge.m -o pairing/native/bin/bridge-fixture
          if pairing/native/bin/bridge-fixture; then
            echo 'AppKit fixture exited successfully'
          else
            lldb --batch -o run -o 'thread backtrace all' -- pairing/native/bin/bridge-fixture || true
            exit 1
          fi
      - name: Build self contained app with pinned runtimes
        run: node pairing/scripts/package.mjs
      - name: Check actual macOS 13.0 deployment targets
        run: node pairing/scripts/check-macos-target.mjs target/release/Rieul-desktop.app
      - name: Verify payload integrity failure boundaries
        run: node pairing/scripts/bundle-qa.mjs --bundle target/release/Rieul-desktop.app
      - name: Verify launcher and GPUiX/AppKit lifecycle in isolated fixture
        working-directory: pairing
        env:
          RIEUL_GUI_EXECUTABLE: ${{ github.workspace }}/target/release/Rieul-desktop.app/Contents/MacOS/rieul-gui
        run: node scripts/macos-native-qa.mjs
      - uses: pnpm/action-setup@v4
      - name: Install daemon codegen and packaging dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer wrapper and validate signed PKG payload without installation
        run: |
          bash scripts/macos/package-desktop-pkg.sh --app-sign - --out-dir "$PWD/dist/candidate"
          pkgutil --expand-full dist/candidate/rieul-macos-desktop-0.1.0.pkg "$RUNNER_TEMP/rieul-expanded"
          GUI=$(find "$RUNNER_TEMP/rieul-expanded" -path '*/Rieul.app/Contents/MacOS/rieul-gui' -type f -print -quit)
          test -n "$GUI"
          "$GUI" --verify-bundle
          codesign --verify --deep --strict "${GUI%/Contents/MacOS/rieul-gui}"
          (cd pairing && RIEUL_GUI_EXECUTABLE="$GUI" node scripts/macos-native-qa.mjs)
      - name: Build and verify DMG without installation
        run: |
          bash scripts/macos/package-desktop-dmg.sh --skip-build --sign - --out-dir "$PWD/dist/candidate-dmg"
          hdiutil verify dist/candidate-dmg/rieul-macos-desktop-0.1.0.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-${{ matrix.os }}-evidence
          path: pairing/artifacts/
          retention-days: 3
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: pairing
        run: bun install --frozen-lockfile
      - working-directory: pairing
        run: |
          bun run check
          bun run test
      - run: cargo test -p rieul-gui-launcher --locked
      - name: Verify development process ownership predicates without starting services
        shell: pwsh
        run: ./scripts/windows/test-dev-process-scope.ps1
      - name: Build and verify embedded runtimes and native payload
        run: node pairing/scripts/package.mjs
      - name: Verify actual build in a spaced Unicode checkout path
        env:
          RIEUL_PAIRING_BUN: ${{ github.workspace }}/target/release/rieul-windows-gui/runtime/bun.exe
        run: node pairing/scripts/build-path-qa.mjs
      - run: node pairing/scripts/bundle-qa.mjs --bundle target/release/rieul-windows-gui --lifecycle
      - name: Exercise bundled native window and pairing request lifecycle
        working-directory: pairing
        env:
          RIEUL_GUI_EXECUTABLE: ${{ github.workspace }}/target/release/rieul-windows-gui/rieul-windows-gui.exe
          RIEUL_PAIRING_BUN: ${{ github.workspace }}/target/release/rieul-windows-gui/runtime/bun.exe
          RIEUL_PAIRING_EMPTY_PATH: "1"
          RIEUL_PAIRING_LAUNCHER: ${{ github.workspace }}/pairing/scripts/launch.ps1
        run: node scripts/native-qa.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build unsigned installers and inspect payloads without installing
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          cargo build -p rieul-windows-daemon --release --bin rieul-windows-system --bin rieul-windows-user --locked
          if ($LASTEXITCODE) { throw 'Daemon build failed' }
          dotnet tool restore
          dotnet tool run wix -- eula accept wix7
          $gui = Join-Path $PWD 'target/release/rieul-windows-gui'
          ./scripts/windows/package-desktop-msi.ps1 -Version 0.1.0
          dotnet tool run wix -- msi decompile dist/windows/rieul-windows-desktop-0.1.0.msi -x tmp/msi-unpacked -o tmp/msi-unpacked.wxs
          ./scripts/windows/verify-msi-payload.ps1 -Source dist/windows/rieul-windows-desktop-0.1.0-msi/Package.wxs -Extracted tmp/msi-unpacked -GuiBundle $gui
          ./scripts/windows/package-desktop-msix.ps1 -SkipSign -Version 0.1.0
          $makeappx = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin') -Filter makeappx.exe -Recurse | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName unpack /p dist/windows/rieul-windows-desktop-0.1.0.unsigned.msix /d tmp/msix-unpacked
          if ($LASTEXITCODE) { throw 'MSIX unpack failed' }
          & ./tmp/msix-unpacked/gui/rieul-windows-gui.exe --verify-bundle
          if ($LASTEXITCODE) { throw 'MSIX GUI verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairing-windows-evidence
          path: pairing/artifacts/
          retention-days: 3
